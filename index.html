
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Jackpot | 금액 룰렛</title>

  <style>
    :root {
      --pink: #e76ca3;
      --deep-pink: #bb4f86;
      --gold: #d3a45d;
      --ink: #70455e;
      --reel-height: 78px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 15px;
      display: grid;
      place-items: center;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, #fff8fc, #fbd4e7);
    }

    .page {
      width: min(100%, 560px);
      text-align: center;
    }

    .eyebrow {
      color: #b57b98;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .28em;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: clamp(32px, 8vw, 52px);
      color: var(--deep-pink);
      text-shadow: 0 3px 0 white;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #a98297;
      font-size: 14px;
    }

    /* 슬롯머신 본체 */
    .machine {
      border: 3px solid white;
      border-radius: 34px;
      padding: 18px;
      background: linear-gradient(
        145deg,
        #ffe6f0,
        #f6abc9 70%,
        #e89abc
      );
      box-shadow:
        0 16px 35px #bb63915c,
        inset 0 0 0 2px #ebbbd0;
    }

    /* 금빛 전구 */
    .lights {
      display: flex;
      justify-content: space-around;
      margin: 3px 4px 16px;
    }

    .lights:last-child {
      margin: 16px 4px 3px;
    }

    .light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffe6a6;
      box-shadow: 0 0 8px #ffcc76;
    }

    .light:nth-child(3n) {
      background: white;
      box-shadow: 0 0 9px white;
    }

    .machine.is-spinning .light {
      animation: blink .45s infinite alternate;
    }

    .machine.is-spinning .light:nth-child(even) {
      animation-delay: .23s;
    }

    @keyframes blink {
      to { opacity: .25; }
    }

    /* 숫자 표시판 */
    .panel {
      padding: 18px 11px 16px;
      background: #fff7fa;
      border: 2px solid white;
      border-radius: 24px;
    }

    .panel-title {
      margin: 0 0 15px;
      color: #c39858;
      font-weight: 900;
      letter-spacing: .19em;
      font-size: 13px;
    }

    .number-board {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .digit-cell {
      min-width: 0;
      flex: 1;
    }

    .reel-window {
      height: var(--reel-height);
      overflow: hidden;
      border: 1px solid #e8c1d2;
      border-radius: 12px;
      background: linear-gradient(
        #eedde6,
        white 27%,
        white 73%,
        #e9d5e1
      );
      box-shadow: inset 0 3px 9px #9a739130;
    }

    .reel-track {
      will-change: transform;
    }

    .digit-face {
      height: var(--reel-height);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(31px, 8vw, 49px);
      font-variant-numeric: tabular-nums;
    }

    .separator {
      font-size: 29px;
      font-weight: 900;
      color: #bd7ba1;
    }

    .currency {
      color: #b68a4e;
      font-size: 19px;
      font-weight: 900;
    }

    /* 개별 숫자 시작 / 정지 버튼 */
    .step-btn {
      width: 100%;
      margin-top: 9px;
      padding: 5px 0;
      border: 1px solid #efbed2;
      border-radius: 10px;
      color: #c46693;
      background: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 2px 0 #efc6d9;
    }

    .step-btn:hover:not(:disabled) {
      background: #ffe3ef;
    }

    .step-btn.is-rolling {
      color: white;
      border-color: #ba5287;
      background: linear-gradient(
        135deg,
        #ee88b7,
        #c35a92
      );
      box-shadow: 0 0 12px #e76ca380;
      animation: reelPulse .65s ease-in-out infinite alternate;
    }

    @keyframes reelPulse {
      to { filter: brightness(1.12); }
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .note {
      margin: 13px 0 0;
      font-size: 12px;
      color: #a9879b;
    }

    /* 전체 자동 추첨 버튼 */
    .spin-btn {
      width: min(100%, 370px);
      margin: 26px auto 4px;
      padding: 18px 16px;
      border: 2px solid #ffe3ef;
      border-radius: 999px;
      color: white;
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(
        110deg,
        #ff9bc7,
        #e76ca3,
        #c95991
      );
      box-shadow:
        0 7px 0 #a94e7e,
        0 12px 23px #c775a05c;
      cursor: pointer;
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(3px);
    }

    /* 당첨 결과 */
    .result {
      margin-top: 30px;
      padding: 22px 12px;
      border-radius: 23px;
      border: 2px solid white;
      background: #ffffffde;
      box-shadow: 0 8px 28px #d68aa84a;
    }

    .result-label {
      margin: 0;
      color: #b890a5;
      letter-spacing: .19em;
      font-size: 12px;
      font-weight: 900;
    }

    .result-amount {
      margin: 12px 0;
      color: var(--deep-pink);
      font-size: clamp(27px, 8vw, 44px);
      font-weight: 900;
    }

    .result-message {
      margin: 0;
      color: #9b778f;
      font-size: 13px;
    }

    /* 잭팟 효과 */
    .result.jackpot {
      animation: glow .55s alternate 7;
    }

    .result.jackpot .result-amount {
      color: #c58b27;
    }

    @keyframes glow {
      to {
        box-shadow: 0 0 35px #f6c95e;
      }
    }

    /* 축하 폭죽 */
    #confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      top: -25px;
      width: 9px;
      height: 15px;
      animation: fall 2.7s ease-in forwards;
    }

    @keyframes fall {
      to {
        transform:
          translate(var(--drift), 110vh)
          rotate(800deg);
        opacity: 0;
      }
    }

    /* 모바일 */
    @media (max-width: 390px) {
      :root {
        --reel-height: 61px;
      }

      .machine {
        padding: 11px;
        border-radius: 26px;
      }

      .panel {
        padding: 15px 7px;
      }

      .number-board {
        gap: 3px;
      }

      .separator {
        font-size: 21px;
      }

      .currency {
        font-size: 15px;
      }

      .light {
        width: 7px;
        height: 7px;
      }
    }
  </style>
</head>

<body>

<main class="page">

  <div class="eyebrow">✦ LUCKY GACHA ✦</div>

  <h1>🎰 PINK JACKPOT</h1>

  <p class="subtitle">
    오늘의 행운은 얼마일까요?
  </p>

  <section class="machine" id="machine">

    <div class="lights" id="lightsTop"></div>

    <div class="panel">

      <p class="panel-title">
        ✦ DREAMY PRIZE ✦
      </p>

      <div
        class="number-board"
        id="numberBoard">
      </div>

      <p class="note">
        ↻ 누르면 계속 회전 · 다시 누르면 멈춰요!
      </p>

    </div>

    <div class="lights" id="lightsBottom"></div>

  </section>

  <button
    type="button"
    class="spin-btn"
    id="spinBtn">
    ✨ 전체 랜덤 돌리기 ✨
  </button>

  <section
    class="result"
    id="result"
    aria-live="polite">

    <p class="result-label" id="resultLabel">
      READY TO PLAY?
    </p>

    <p class="result-amount" id="resultAmount">
      행운을 돌려보세요!
    </p>

    <p class="result-message" id="resultMessage">
      1원 단위로 금액이 추첨됩니다.
    </p>

  </section>

  <p class="note">
    직접 멈춘 숫자는 수동 결과이며,
    전체 랜덤 추첨에만 확률이 적용됩니다.
  </p>

</main>

<div id="confetti"></div>

<script>

  /* 금액 구간별 확률 */
  const prizeRanges = [
    { min: 1000,  max: 2999,  weight: 30 },
    { min: 3000,  max: 4999,  weight: 30 },
    { min: 5000,  max: 9999,  weight: 20 },
    { min: 10000, max: 29999, weight: 15 },
    { min: 30000, max: 49999, weight: 4 },
    { min: 50000, max: 50000, weight: 1 }
  ];

  const $ = id => document.getElementById(id);

  const values = [0, 1, 0, 0, 0];

  const tracks = [];
  const buttons = [];

  const manuallySpinning = [
    false, false, false, false, false
  ];

  const stopRequested = [
    false, false, false, false, false
  ];

  let spinning = false;

  const wait = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  const money = amount =>
    amount.toLocaleString("ko-KR") + "원";


  /* 랜덤 숫자 생성 */
  function randomInt(min, max) {
    const size = max - min + 1;

    if (window.crypto?.getRandomValues) {
      const sample = new Uint32Array(1);
      const limit =
        Math.floor(4294967296 / size) * size;

      do {
        window.crypto.getRandomValues(sample);
      } while (sample[0] >= limit);

      return min + (sample[0] % size);
    }

    return min + Math.floor(Math.random() * size);
  }


  /* 전체 금액 추첨 */
  function drawPrize() {
    let ticket = randomInt(1, 100);

    for (const range of prizeRanges) {
      ticket -= range.weight;

      if (ticket <= 0) {
        return randomInt(range.min, range.max);
      }
    }

    return 1000;
  }


  /* 숫자 표시 */
  function drawDigit(i) {
    tracks[i].innerHTML =
      `<div class="digit-face">${values[i]}</div>`;

    tracks[i].style.transition = "none";
    tracks[i].style.transform = "translateY(0)";
  }


  /* 슬롯머신 생성 */
  function buildMachine() {

    ["lightsTop", "lightsBottom"].forEach(id => {
      $(id).innerHTML =
        '<span class="light"></span>'.repeat(17);
    });

    for (let i = 0; i < 5; i++) {

      const cell = document.createElement("div");
      cell.className = "digit-cell";

      const windowEl = document.createElement("div");
      windowEl.className = "reel-window";

      const track = document.createElement("div");
      track.className = "reel-track";

      windowEl.append(track);

      const btn = document.createElement("button");

      btn.type = "button";
      btn.className = "step-btn";
      btn.textContent = "↻";

      btn.setAttribute("aria-pressed", "false");

      btn.addEventListener("click", () => {
        toggleManualReel(i);
      });

      cell.append(windowEl, btn);

      $("numberBoard").append(cell);

      tracks.push(track);
      buttons.push(btn);

      drawDigit(i);

      if (i === 1) {
        const comma = document.createElement("span");

        comma.className = "separator";
        comma.textContent = ",";

        $("numberBoard").append(comma);
      }
    }

    const won = document.createElement("span");

    won.className = "currency";
    won.textContent = "원";

    $("numberBoard").append(won);
  }


  /* 숫자를 한 단계 이동시키는 애니메이션 */
  async function advanceOne(i, duration = 120) {

    const next = (values[i] + 1) % 10;
    const track = tracks[i];

    track.innerHTML =
      `<div class="digit-face">${values[i]}</div>` +
      `<div class="digit-face">${next}</div>`;

    track.style.transition = "none";
    track.style.transform = "translateY(0)";

    void track.offsetHeight;

    track.style.transition =
      `transform ${duration}ms ease-in-out`;

    track.style.transform =
      "translateY(calc(-1 * var(--reel-height)))";

    await wait(duration + 18);

    values[i] = next;

    drawDigit(i);
  }


  /*
   * 개별 숫자 시작 / 정지
   *
   * 첫 클릭: 계속 회전
   * 두 번째 클릭: 그 시점에 정지 요청
   */
  async function toggleManualReel(i) {

    if (spinning) return;

    /* 이미 돌아가고 있다면 멈추기 */
    if (manuallySpinning[i]) {
      stopRequested[i] = true;
      return;
    }

    manuallySpinning[i] = true;
    stopRequested[i] = false;

    buttons[i].textContent = "■";
    buttons[i].classList.add("is-rolling");

    buttons[i].setAttribute(
      "aria-pressed", "true"
    );

    $("spinBtn").disabled = true;

    $("machine").classList.add("is-spinning");

    $("result").classList.remove("jackpot");

    $("resultLabel").textContent = "MANUAL MODE";

    $("resultAmount").textContent = "돌아가는 중...";

    $("resultMessage").textContent =
      "원하는 순간에 ■ 버튼을 눌러 멈춰주세요!";

    try {

      /* 정지 버튼을 누를 때까지 계속 회전 */
      while (!stopRequested[i]) {
        await advanceOne(i, 74);
      }

    } finally {

      manuallySpinning[i] = false;
      stopRequested[i] = false;

      buttons[i].textContent = "↻";

      buttons[i].classList.remove("is-rolling");

      buttons[i].setAttribute(
        "aria-pressed", "false"
      );

      /* 모든 칸이 멈춘 경우 */
      if (!manuallySpinning.some(Boolean)) {

        $("spinBtn").disabled = false;

        $("machine").classList.remove("is-spinning");

        const amount = Number(values.join(""));

        $("resultLabel").textContent =
          "직접 멈춘 결과";

        $("resultAmount").textContent =
          money(amount);

        $("resultMessage").textContent =
          amount >= 1000 && amount <= 50000
            ? "직접 멈춘 숫자의 조합입니다."
            : "1,000~50,000원 범위를 벗어났어요.";
      }
    }
  }


  /* 전체 자동 추첨 시 숫자 회전 */
  async function spinDigit(i, target) {

    await wait(i * 150);

    const turns = 15 + i * 4;

    const extra =
      (target - values[i] - turns % 10 + 10) % 10;

    const total = turns + extra;

    for (let step = 0; step < total; step++) {

      const slowdown = (step / total) ** 4;

      await advanceOne(
        i,
        Math.round(45 + slowdown * 145)
      );
    }
  }


  /* 폭죽 효과 */
  function celebrate() {

    const layer = $("confetti");

    layer.replaceChildren();

    const colors = [
      "#e76ca3",
      "#f8c75d",
      "#ad7dd0",
      "#fff0b9"
    ];

    for (let i = 0; i < 60; i++) {

      const piece = document.createElement("span");

      piece.className = "piece";

      piece.style.left =
        randomInt(0, 100) + "%";

      piece.style.background =
        colors[i % colors.length];

      piece.style.animationDelay =
        (Math.random() * .6) + "s";

      piece.style.setProperty(
        "--drift",
        randomInt(-140, 140) + "px"
      );

      layer.append(piece);
    }

    setTimeout(() => {
      layer.replaceChildren();
    }, 3500);
  }


  /* 전체 랜덤 돌리기 */
  async function spinAll() {

    if (
      spinning ||
      manuallySpinning.some(Boolean)
    ) return;

    spinning = true;

    $("machine").classList.add("is-spinning");

    $("spinBtn").disabled = true;

    buttons.forEach(btn => {
      btn.disabled = true;
    });

    $("spinBtn").textContent =
      "🎰 돌아가는 중...";

    $("result").classList.remove("jackpot");

    $("resultLabel").textContent = "DRAWING";

    $("resultAmount").textContent = "두구두구...";

    $("resultMessage").textContent =
      "숫자가 차례로 멈춥니다!";

    try {

      const prize = drawPrize();

      const target = String(prize)
        .padStart(5, "0")
        .split("")
        .map(Number);

      await Promise.all(
        target.map((digit, i) => spinDigit(i, digit))
      );

      if (prize === 50000) {

        $("resultLabel").textContent =
          "👑 JACKPOT 👑";

        $("result").classList.add("jackpot");

      } else if (prize >= 10000) {

        $("resultLabel").textContent =
          "✦ BIG WIN ✦";

      } else {

        $("resultLabel").textContent =
          "🎉 CONGRATULATIONS 🎉";
      }

      $("resultAmount").textContent =
        money(prize);

      $("resultMessage").textContent =
        "당첨을 축하합니다! 💗";

      if (prize >= 10000) {
        celebrate();
      }

    } finally {

      spinning = false;

      $("machine").classList.remove("is-spinning");

      $("spinBtn").disabled = false;

      buttons.forEach(btn => {
        btn.disabled = false;
      });

      $("spinBtn").textContent =
        "✨ 다시 돌리기 ✨";
    }
  }


  /* 초기 실행 */
  buildMachine();

  $("spinBtn").addEventListener(
    "click",
    spinAll
  );

</script>

</body>
</html>
